<div id="lang-switcher" class="btn-group sm" aria-label="Language switcher">
  <button type="button" class="btn btn-switch" [class.is-active]="currentLang() === 'fr'" (click)="switchTo('fr')">FR</button>
  <button type="button" class="btn btn-switch" [class.is-active]="currentLang() === 'en'" (click)="switchTo('en')">EN</button>
</div>
