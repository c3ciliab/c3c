<div class="app-shell" [ngClass]="mode">
  <aside class="shell-side s-left">
    <!-- slide-fade menu -->
    <app-left-side-nav id="side-menu" class="side-menu" [class.is-open]="isMenuOpen()" [class.is-closed]="!isMenuOpen()" />
    <!-- <app-language-switcher /> -->
    @if (showLanguageSwitcher) {
      <app-language-switcher />
    }
  </aside>

  <main class="shell-main">
    <div class="background-scene" aria-hidden="true"></div>
    <ng-content></ng-content>
  </main>

  <aside class="shell-side s-right">
    <app-language-switcher />
  </aside>

  <nav class="ps-pad">
    <!-- circle-->
    <app-pspad-button shape="circle" iconPath="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16" />

    <!-- square -->
    <app-pspad-button
      shape="menu-toggle square" [class.is-open]="isMenuOpen()" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen()" aria-controls="side-menu"
      iconPath="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z" />

    <!-- cross -->
    <!-- included in next-section-button -->

    <!-- triangle -->
    <app-pspad-button shape="triangle" routerLink="/" iconPath="M7.938 2.016A.13.13 0 0 1 8.002 2a.13.13 0 0 1 .063.016.15.15 0 0 1 .054.057l6.857 11.667c.036.06.035.124.002.183a.2.2 0 0 1-.054.06.1.1 0 0 1-.066.017H1.146a.1.1 0 0 1-.066-.017.2.2 0 0 1-.054-.06.18.18 0 0 1 .002-.183L7.884 2.073a.15.15 0 0 1 .054-.057m1.044-.45a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767z" />
  </nav>
</div>
