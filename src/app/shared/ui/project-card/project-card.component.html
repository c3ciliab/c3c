<article class="project-card">
  <a class="card-link" [routerLink]="['/', lang, 'project', project.slug]">
    <div class="card-panel">
      <h2>{{ project.type }}</h2>
    </div>
    <img [src]="project.cover" [alt]="project.title" />
    <p class="card-summary">{{ project.summary }}</p>
  </a>

  <div class="card-content">
    <header class="card-header">
      <!-- <p class="card-meta">{{ project.client }} · {{ project.period }}</p> -->
      <p class="card-meta">{{ project.client }}</p>
      <a [routerLink]="['/', lang, 'project', project.slug]">
        <h5>
          {{ project.title }}
          <span>{{ project.subtitle }}</span>
        </h5>
      </a>
    </header>

    <ul class="tag-list">
      @for (tag of project.tags; track tag) {
        <li>
          <app-chip-tag [tag]="tag"></app-chip-tag>
        </li>
      }
    </ul>
  </div>
</article>
