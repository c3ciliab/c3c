<button type="button" class="btn btn-next" [class.is-back-to-top]="isBackToTop" [attr.aria-label]="label()" (click)="next()">
  <span>{{ label() }}</span>

  @if (direction !== 'none') {
    <span class="next-icon" aria-hidden="true">{{ icon() }}</span>
  }
</button>
