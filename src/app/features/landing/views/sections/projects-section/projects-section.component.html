<section id="portfolio" class="screen-section" data-section appSectionAnchor sectionId="portfolio">

  <div class="inner">

    <header class="section-header">
      <img src="assets/img/icons/arrow-straight.png" alt="arrow" />
      <h4>{{ t('projects.kicker') }}</h4>
      <button class="h5" [routerLink]="['/', currentLang(), 'full-portfolio']">
        <span class="nav-label">{{ label('nav.portfolioFull') }}</span>
        <span>→</span>
      </button>
    </header>

    <div class="wrapper">
      <aside class="prop">
        <h3>{{ t('projects.title') }}</h3>
        <!-- <p class="h3">{{ t('projects.intro') }}</p> -->
      </aside>
      <div class="scene">
        @for (project of projects(); track project.id; let i = $index) {
          <app-project-card [project]="project" [lang]="lang()" [variant]="cardVariant(i)" />
        }
      </div>
    </div>
  </div>

  <div class="next">
    <app-next-section-button currentSectionId="portfolio" labelKey="next.journey" />
  </div>
</section>
