<section
  id="home"
  class="screen-section hero-section"
  data-section
  appSectionAnchor
  sectionId="home">

  <div class="hero-section__overlay" appParallaxLayer [speed]="0.08" axis="y"></div>

  <div class="hero-section__content">
    <img src="assets/img/icons/logo.png" alt="Symbol" width="80" />
    <p class="hero-section__eyebrow">{{ title() }}</p>
    <h1>{{ t('home.title') }}</h1>
    <p class="hero-section__subtitle">{{ t('home.subtitle') }}</p>

    <div class="hero-section__actions">
      <a href="#portfolio" class="hero-link">{{ t('home.cta.projects') }}</a>
      <a href="#contact" class="hero-link hero-link--secondary">{{ t('home.cta.contact') }}</a>
    </div>
  </div>

  <div class="hero-section__next">
    <app-next-section-button currentSectionId="home" />
  </div>
</section>
