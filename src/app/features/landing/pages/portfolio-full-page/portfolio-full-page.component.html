@if (ready()) {

    <section class="screen-section standalone-page">
      <div class="inner">
        <div class="wrapper">
          <div class="scene">
            <p class="section-kicker">{{ t('anotherUniverse.kicker') }}</p>
            <h1>{{ t('anotherUniverse.title') }}</h1>
            <p>{{ t('anotherUniverse.intro') }}</p>
            <div class="standalone-page__actions">
              <a class="btn btn-main" [routerLink]="['/', currentLang()]">
                {{ t('anotherUniverse.back') }}

            </div>
          </div>
        </div>
      </div>
    </section>
  </app-shell>
}
